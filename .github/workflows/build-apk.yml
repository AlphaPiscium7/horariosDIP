# Compila el APK en los servidores de GitHub (no hace falta PC)
# y lo publica como "Release" descargable desde el celular.
name: Compilar APK

on:
  push:
    branches: [main]      # cada vez que se sube algo a "main"
  workflow_dispatch:      # también se puede lanzar a mano desde la pestaña "Actions"

permissions:
  contents: write         # necesario para crear la Release

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle (con caché para que sea más rápido)
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar el APK (versión release, firmada)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PnumeroVersion=${{ github.run_number }} --stacktrace

      - name: Renombrar a TraductorESPT.apk
        run: cp app/build/outputs/apk/release/app-release.apk TraductorESPT.apk

      - name: Guardar el APK como artefacto (copia de respaldo)
        uses: actions/upload-artifact@v4
        with:
          name: TraductorESPT
          path: TraductorESPT.apk

      - name: Publicar la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TraduciAr-Por v1.0.${{ github.run_number }}
          body: |
            APK listo para instalar en Android 7.0 o superior.
            Descargá **TraductorESPT.apk** desde el celular y abrilo para instalar.
          files: TraductorESPT.apk
          make_latest: true
